[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-dxlog-plugin"
version = "0.1.0"
description = "MkDocs plugin for dxlog research project integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "dxlog contributors", email = "noreply@x-gradient.com"},
]
keywords = ["mkdocs", "plugin", "documentation", "research", "dxlog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "mkdocs>=1.4.0",
    "mkdocs-section-index>=0.3.8",
    "PyYAML>=5.1",
    "toml>=0.10.0",
    "Jinja2>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "pre-commit>=3.0.0",
]
testing = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mkdocs-material>=9.0.0",
    "pytest-mock>=3.0.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings>=0.24.0",
    "mkdocs-gen-files>=0.4.0",
]

[project.entry-points."mkdocs.plugins"]
dxlog = "mkdocs_dxlog_plugin.plugin:DxlogPlugin"

[project.urls]
Homepage = "https://github.com/x-gradient/dxlog"
Repository = "https://github.com/x-gradient/dxlog.git"
Documentation = "https://github.com/x-gradient/dxlog/tree/main/mkdocs-dxlog-plugin"
Issues = "https://github.com/x-gradient/dxlog/issues"

[tool.hatch.build.targets.sdist]
include = [
    "mkdocs_dxlog_plugin/**/*.py",
    "example/**/*",
    "README.md",
    "LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_dxlog_plugin"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=mkdocs_dxlog_plugin",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]